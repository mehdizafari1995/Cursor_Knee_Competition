# Phase 4F.3 follow-on score-bearing protocol. Prepared, not launched.
# Comparator is frozen gold58 v2 primary-series OOF. Do not retune v2.
protocol: gold58-image-resnet18-3plane-oof-v1
kernel_slug: mahdimzafari/rsna-knee-gold58-3plane-oof-v1
seed: 42
n_folds: 5
encoder: resnet18
pretrained: true
imagenet_weights_filename: resnet18-f37072fd.pth

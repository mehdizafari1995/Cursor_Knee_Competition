# Frozen runtime lexicon for Phase 4B report-label extraction.
# Ontology-verified terms come from literature/ontology.yaml.
# Additional multilingual items are clinical-standard abbreviations/phrases
# and are NOT claimed as ontology-verified. No external language model is used.
# Version 1 is frozen at configs/report_labeler_v1.yaml for direct comparison.
extractor_version: report-labeler-v2.0.0
eval_protocol_version: gold-eval-v2.0.0
schema_version: 2
v1_config: configs/report_labeler_v1.yaml
preserve_v1_metrics: true
source_of_truth_targets: knee/config.py::TARGET_KEYS
no_external_language_model: true
internet_required: false
gpu_required: false
unknown_policy: never_impute_as_negative
gold_labels_in_extractor: forbidden
conditional_sensitivity_is_not_full_set_sensitivity: true

bootstrap:
  n_resamples: 1000
  ci_level: 0.95
  seed: 42
  unit: study

small_n_targets:
  - mcl_injury
  - lateral_compartment_oa
  - baker_cyst

confidence:
  explicit_positive: 0.92
  explicit_negative: 0.88
  global_normal: 0.80
  abbreviation_positive: 0.78
  multilingual_standard: 0.70
  uncertain: 0.35
  unknown: 0.0

confidence_policies:
  default:
    min_positive_precision: 0.85
    min_negative_npv: 0.85
    min_positive_coverage: 0.05
    min_negative_coverage: 0.05
    do_not_lower_thresholds_globally: true
  oof:
    n_folds: 5
    seed: 42
  targets:
    acl_injury:
      positive_threshold: 0.85
      negative_threshold: 0.80
    mcl_injury:
      positive_threshold: 0.90
      negative_threshold: 0.85
    medial_meniscus_injury:
      positive_threshold: 0.92
      negative_threshold: 0.85
    lateral_meniscus_injury:
      positive_threshold: 0.92
      negative_threshold: 0.85
    medial_compartment_oa:
      positive_threshold: 0.92
      negative_threshold: 0.88
    lateral_compartment_oa:
      positive_threshold: 0.92
      negative_threshold: 0.88
    patellofemoral_oa:
      positive_threshold: 0.92
      negative_threshold: 0.88
    joint_effusion:
      positive_threshold: 0.88
      negative_threshold: 0.85
    synovitis:
      positive_threshold: 0.92
      negative_threshold: 0.88
    baker_cyst:
      positive_threshold: 0.90
      negative_threshold: 0.85
    bone_contusion:
      positive_threshold: 0.90
      negative_threshold: 0.85
    fracture:
      positive_threshold: 0.90
      negative_threshold: 0.85

second_reader:
  enabled: false
  download_weights: false
  internet_required: false
  combiner: conservative_agreement
  rules_documented_in: reports/competition_pretrained_model_rules.md
  model_id: null
  weights_path: null
  weights_sha256: null
  note: >
    Public pretrained models are allowed by the competition overview when they
    are freely and publicly available, of minimal cost, and attached locally
    because scoring notebooks disable internet. This extractor does not
    download or load weights in v2.0.0.

languages:
  supported:
    - en
    - es
    - fr
    - de
    - it
    - pt
    - nl
    - pl
    - tr
    - el
    - bg
    - ru
    - uk
    - ro
    - cs
    - hu
    - sv
    - da
    - fi
    - ca
  uncertain_margin: 0.15
  min_score: 2.0
  independent_detector: char_trigram
  keep_uncertain_separate: true
  latin_technical_tokens_do_not_force_mixed_uncertain: true
  unsupported_policy: unknown_unless_language_agnostic_abbreviation

oa_severity:
  # Binary competition OA: definite osteoarthritis of that compartment.
  # KL 0 / no OA -> negative. KL 1 (doubtful) -> unknown. KL 2-4 -> positive.
  # Isolated "mild degenerative change" without OA/chondrosis -> unknown.
  positive_kl: [2, 3, 4]
  unknown_kl: [1]
  negative_kl: [0]
  outerbridge_positive: [3, 4]
  outerbridge_unknown: [1, 2]
  positive_morphology:
    - osteoarthritis
    - osteoarthrosis
    - osteoarthritic
    - gonarthrosis
    - chondrosis
    - chondropathy
    - cartilage loss
    - full-thickness cartilage
    - denudation
    - osteophytes
  unknown_morphology:
    - mild degenerative
    - degenerative change
    - degenerative signal
    - chondromalacia
  negative_morphology:
    - no osteoarthritis
    - no osteoarthrosis
    - cartilage intact
    - cartilage preserved

effusion_severity:
  # High-precision: physiologic/trace/minimal stay unknown (annotator threshold).
  positive_qualifiers:
    - small
    - mild
    - moderate
    - large
    - marked
    - massive
    - tense
    - significant
    - sizable
    - abundant
  unknown_qualifiers:
    - trace
    - minimal
    - tiny
    - physiologic
    - physiological
    - physiological-amount
  negative_phrases:
    - no effusion
    - no joint effusion
    - no joint fluid
    - no excess fluid
    - no hydrarthrosis

